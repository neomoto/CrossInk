name: CI (build)

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer commit supersedes older PR validation; keep branch pushes independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_suffix: ${{ steps.release.outputs.artifact_suffix }}
    steps:
      - uses: actions/checkout@v6
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          fetch-depth: 0

      - name: Prepare release metadata
        id: release
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$GITHUB_REF" != refs/tags/v* ]]; then
            printf 'version=\nartifact_suffix=\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]]; then
            echo "::error::Invalid release tag: use v followed by a numeric-dot version and optional alphanumeric prerelease segments separated by single dots or dashes."
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tags must point to a commit on origin/main."
            exit 1
          fi

          printf 'version=%s\nartifact_suffix=-v%s\n' "$version" "$version" >> "$GITHUB_OUTPUT"

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # pio check generates build metadata via pio run, which can invoke
          # custom_sdkconfig's nested pio run from ~/.platformio/penv.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          for environment in default sticky x4-pro x4-classic; do
            pio pkg install -e "$environment"
          done
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Run cppcheck
        run: pio check --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    needs: release-metadata
    env:
      CROSSINK_RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
          - environment: sticky
            firmware: firmware-sticky
          - environment: x4-pro
            firmware: firmware-x4-pro
          - environment: x4-classic
            firmware: firmware-x4-classic
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv.
          # Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build ${{ matrix.environment }} firmware
        run: |
          set -euo pipefail
          pio run -j1 -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.environment }} firmware build stats"
            grep -E "RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}${{ needs.release-metadata.outputs.artifact_suffix }}.bin
          if-no-files-found: error

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libexpat1-dev zlib1g-dev

      - name: Configure native tests
        run: cmake -S test -B build/native-tests

      - name: Build native tests
        run: cmake --build build/native-tests -j2

      - name: Run native tests
        run: ctest --test-dir build/native-tests --output-on-failure

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - native-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0

  publish-release:
    needs:
      - release-metadata
      - build
      - clang-format
      - cppcheck
      - native-tests
      - test-status
    if: >-
      ${{ always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
          needs.release-metadata.result == 'success' && needs.build.result == 'success' &&
          needs.clang-format.result == 'success' && needs.cppcheck.result == 'success' &&
          needs.native-tests.result == 'success' && needs.test-status.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ci-firmware-*
          path: release-firmware
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(needs.release-metadata.outputs.version, '-') }}
          files: |
            release-firmware/firmware-x3-x4-v${{ needs.release-metadata.outputs.version }}.bin
            release-firmware/firmware-sticky-v${{ needs.release-metadata.outputs.version }}.bin
            release-firmware/firmware-x4-pro-v${{ needs.release-metadata.outputs.version }}.bin
            release-firmware/firmware-x4-classic-v${{ needs.release-metadata.outputs.version }}.bin
